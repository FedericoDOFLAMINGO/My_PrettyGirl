<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Mi AMOR💗</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Quicksand',system-ui,sans-serif;color:#4a1d3a;background:radial-gradient(ellipse at top,#6b2158,#2b0f2e 70%);background-attachment:fixed;overflow-x:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.p{position:absolute;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(30deg);opacity:0}}
.sp{position:absolute;animation:sp .8s ease-out forwards}
@keyframes sp{to{transform:translateY(-26px) scale(.2);opacity:0}}
.petal{position:fixed;top:-30px;font-size:18px;animation:fall linear forwards;pointer-events:none;z-index:1}
@keyframes fall{to{transform:translate(60px,110vh) rotate(360deg);opacity:.2}}
#env{position:fixed;inset:0;display:grid;place-items:center;z-index:3;transition:opacity 1s,transform 1s}
#env.gone{opacity:0;transform:translateY(60px) scale(.9);pointer-events:none}
.env{position:relative;width:min(300px,78vw);aspect-ratio:3/2;background:#f6c6d8;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.45);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.env::before{content:"";position:absolute;inset:0;border-radius:10px;background:linear-gradient(135deg,#fbd9e6 50%,transparent 50%) , linear-gradient(225deg,#fbd9e6 50%,transparent 50%);background-size:50% 100%;background-repeat:no-repeat;background-position:left,right}
.flap{position:absolute;left:0;right:0;top:0;height:60%;background:#f08db0;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s}
.env.open .flap{transform:rotateX(180deg)}
.seal{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:34px;z-index:2;transition:opacity .4s;animation:beat 1.3s infinite}
.env.open .seal{opacity:0}
@keyframes beat{0%,100%{transform:translate(-50%,-50%) scale(1)}20%{transform:translate(-50%,-50%) scale(1.25)}}
#paper{position:relative;z-index:2;max-width:480px;margin:40px auto;padding:34px 26px 40px;border-radius:6px;background:repeating-linear-gradient(#fff8f1 0 33px,#f3dfe3 33px 34px);box-shadow:0 25px 60px rgba(0,0,0,.5);text-align:center;opacity:0;transform:scale(.7) translateY(80px);transition:all 1.2s cubic-bezier(.2,1.2,.4,1);width:calc(100% - 28px)}
#paper.show{opacity:1;transform:none}
#paper h1{font-family:'Dancing Script',cursive;font-size:clamp(38px,11vw,54px);margin:0 0 14px;color:#c2275f}
.line{font-size:18px;line-height:1.7;margin:14px 0;opacity:0;transform:translateY(16px);transition:all 1.1s}
.line.in{opacity:1;transform:none}
.line.big{font-family:'Dancing Script',cursive;font-size:clamp(36px,10vw,50px);color:#d6336c;line-height:1.2;margin:26px 0 10px}
.line.sig{font-family:'Dancing Script',cursive;font-size:30px;color:#c2275f;text-align:right}
.line.big .hr{display:inline-block;animation:beat2 1.2s infinite;cursor:pointer}
@keyframes beat2{0%,100%{transform:scale(1)}20%{transform:scale(1.3)}}
.hint{font-size:13px;opacity:.7}
button{font:inherit;font-weight:600;color:#fff;background:linear-gradient(135deg,#ff5c9a,#d6336c);border:0;border-radius:999px;padding:11px 24px;cursor:pointer;box-shadow:0 6px 18px rgba(214,51,108,.4);margin-top:10px;opacity:0;transition:opacity 1s}
button.in{opacity:1}
#paper{padding:44px 30px 46px;max-width:500px}
#paper::before{content:"";position:absolute;inset:9px;border:1.5px solid #e9a3bd;border-radius:4px;pointer-events:none}
#paper::after{content:"";position:absolute;top:-13px;left:50%;width:120px;height:28px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,170,200,.85);box-shadow:0 2px 6px rgba(0,0,0,.2)}
#paper h1{background:linear-gradient(90deg,#c2275f,#ff7aa8,#c2275f);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
@keyframes sh{to{background-position:200%}}
.line b{color:#d6336c}
.line.q{font-family:'Dancing Script',cursive;font-size:clamp(30px,9vw,40px);color:#c2275f;line-height:1.25;margin:22px 0}
.line.div{color:#e58bab;letter-spacing:8px;margin:18px 0}
.ex{position:fixed;left:50%;top:50%;pointer-events:none;z-index:9;animation:ex 2s ease-out forwards}
@keyframes ex{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r)) scale(.3);opacity:0}}
#ov{position:fixed;inset:0;z-index:8;display:grid;place-items:center;align-content:center;background:radial-gradient(circle,rgba(194,39,95,.9),rgba(43,15,46,.96));opacity:0;pointer-events:none;transition:opacity 1s;text-align:center;padding:24px;color:#fff}
#ov.on{opacity:1;pointer-events:auto}
.af{font-family:'Dancing Script',cursive;font-size:clamp(80px,26vw,140px);line-height:1;text-shadow:0 0 30px #ff7aa8,0 0 60px #ff5c9a;transform:scale(0)}
.af i{font-style:normal;display:inline-block;animation:beat2 1.2s infinite}
#ov.on .af{animation:zoom 1.4s .6s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes zoom{to{transform:scale(1)}}
.ded{max-width:340px;font-size:19px;line-height:1.6;margin-top:18px;opacity:0}
.ded span{font-family:'Dancing Script',cursive;font-size:30px;display:block;margin-top:8px}
#ov.on .ded{animation:fade2 1.5s 1.6s forwards}
@keyframes fade2{to{opacity:1}}
.cl{margin-top:26px;font-size:13px;opacity:.6}
#wel{position:fixed;inset:0;z-index:20;display:grid;place-content:center;gap:14px;text-align:center;color:#fff;background:rgba(43,15,46,.35);transition:opacity 1s;cursor:pointer;padding:24px}
#wel.out{opacity:0;pointer-events:none}
#wel .wh{font-size:80px;animation:beat2 1.3s infinite;filter:drop-shadow(0 0 20px #ff5c9a)}
#wel h2{font-family:'Dancing Script',cursive;font-size:clamp(36px,10vw,52px);margin:0}
#wel p{margin:0;opacity:.85}
#wel .tap{margin-top:10px;font-weight:600;padding:12px 26px;border-radius:999px;background:linear-gradient(135deg,#ff5c9a,#d6336c);justify-self:center;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#ov{overflow-y:auto}
#ov>div{margin:auto;padding:20px 0}
#vid{pointer-events:none;width:min(320px,80vw);max-height:50vh;border-radius:16px;margin-top:18px;border:2px solid rgba(255,255,255,.5);box-shadow:0 10px 30px rgba(0,0,0,.5);background:#000;opacity:0}
#ov.on #vid{animation:fade2 1.5s 2.4s forwards}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="fx"></div>
<audio id="mus" loop preload="auto"><source src="l0v3.mp3" type="audio/mpeg"><source src="https://raw.githubusercontent.com/FedericoDOFLAMINGO/MON_Cher/main/l0v3.mp3" type="audio/mpeg"></audio>
<div id="wel"><div class="wh">💌</div><h2>Angy, tengo algo para ti</h2><p>Sube el volumen 🎶</p><div class="tap">Toca para abrir</div></div>
<div id="env"><div class="env" id="e"><div class="flap"></div><div class="seal">💗</div></div></div>
<div id="paper"><h1>Para mi Angy 💗</h1><div id="lines"></div></div>
<div id="ov"><div><div class="af">A <i>💗</i> F</div><p class="ded">Para ti, Angy: mi persona favorita, mi calma y mi todo. Gracias por ser tú.<span>Con todo mi amor, Fer</span></p><video id="vid" muted loop playsinline preload="auto" disablepictureinpicture disableremoteplayback><source src="nosotros.mp4" type="video/mp4"></video><div class="cl">Toca para cerrar</div></div></div>
<script>
const fx=document.getElementById('fx'),icons=['💗','💖','💕','🌸','✨'];
// estrellas
const cv=document.getElementById('sky'),ctx=cv.getContext('2d');let st=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight;st=Array.from({length:90},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.6+.3,o:Math.random()*6}))}
rs();addEventListener('resize',rs);
(function d(t){ctx.clearRect(0,0,cv.width,cv.height);st.forEach(s=>{ctx.globalAlpha=.4+.6*Math.abs(Math.sin(t/900+s.o));ctx.fillStyle='#ffe3ef';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()});requestAnimationFrame(d)})(0);
// corazones
function heart(x,y){const e=document.createElement('span');e.className='p';e.textContent=icons[Math.floor(Math.random()*5)];e.style.left=x+'px';e.style.top=y+'px';e.style.fontSize=(14+Math.random()*24)+'px';e.style.animationDuration=(3+Math.random()*4)+'s';fx.appendChild(e);setTimeout(()=>e.remove(),7500)}
function burst(x,y,n=14){for(let i=0;i<n;i++)setTimeout(()=>heart(x+(Math.random()-.5)*120,y),i*50)}
function rain(n){for(let i=0;i<n;i++)setTimeout(()=>heart(Math.random()*innerWidth,innerHeight),i*90)}
addEventListener('pointerdown',e=>burst(e.clientX,e.clientY,6));
let last=0;addEventListener('pointermove',e=>{const n=Date.now();if(n-last<70)return;last=n;const s=document.createElement('span');s.className='sp';s.textContent='✨';s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';fx.appendChild(s);setTimeout(()=>s.remove(),800)});
setInterval(()=>{const p=document.createElement('span');p.className='petal';p.textContent='🌸';p.style.left=Math.random()*100+'vw';p.style.animationDuration=(7+Math.random()*6)+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),13000)},900);
// carta
const L=[
 ['Angy,',''],
 ['Mi Princesita, Mi eternidad, Por Siempre Mi AMOR.',''],
 ['❦ ♡ ❦','div'],
 ['Eres todo para mí.','q'],
 ['No sé cómo explicarlo sin quedarme corto, pero <b>te adoro</b>.',''],
 ['<b>Adoro</b> tu risa, la de verdad, la que se te escapa sin avisar.',''],
 ['<b>Adoro</b> tu mirada, y cómo todo lo demás se apaga cuando me ves.',''],
 ['<b>Adoro</b> tu voz, tus mensajes, y hasta tus silencios cuando estás cerca de mí.',''],
 ['<b>Adoro</b> tus manos, tu abrazo, ese lugar donde cabe todo mi cansancio.',''],
 ['<b>Adoro</b> tu ternura, tu fuerza, tus ganas y tu manera de cuidar.',''],
 ['❦ ♡ ❦','div'],
 ['Cada pieza que te hace ser tú, la quiero.','q'],
 ['Y cada cosa que te pertenece también: tus gustos, tus cosas favoritas, tus sueños, tus lugares, tus días buenos y los difíciles.',''],
 ['Todo lo tuyo se volvió especial para mí.',''],
 ['Contigo todo se siente más tranquilo, hasta los días pesados.',''],
 ['Eres mi lugar favorito: donde estés tú, ahí quiero quedarme.',''],
 ['Me haces reír cuando ni lo estoy buscando.',''],
 ['Eres mi calma, mi sonrisa y mi persona favorita.',''],
 ['Quiero compartir contigo lo bueno, lo difícil y todo lo que viene.',''],
 ['❦ ♡ ❦','div'],
 ['Gracias por ser tú, y por existir en mi vida.',''],
 ['Te quiero muchísimo <span class="hr" id="hr">💗</span>','big'],
 ['Siempre tuyo, Tu latoso FER','sig']
];
const box=document.getElementById('lines'),paper=document.getElementById('paper');
function play(){
  box.innerHTML='';let t=600;
  L.forEach(([h,c],i)=>{
    const d=document.createElement('div');d.className='line '+c;d.innerHTML=h;box.appendChild(d);
    setTimeout(()=>{d.classList.add('in');d.scrollIntoView({behavior:'smooth',block:'center'});
      if(c==='big')rain(30);
      if(c==='big'){const hr=d.querySelector('.hr');hr.onclick=ev=>{ev.stopPropagation();burst(ev.clientX,ev.clientY,25)}}
    },t);
    t+=1300+h.length*24;
  });
  setTimeout(()=>{const x=document.createElement('div');x.className='line in hint';x.textContent='Toca el corazón o cualquier parte de la pantalla 💕';box.appendChild(x);
    const b=document.createElement('button');b.textContent='Hiperexplosión de amor 💥💗';b.onclick=ev=>{ev.stopPropagation();boom()};box.appendChild(b);setTimeout(()=>b.classList.add('in'),100)},t);
}
const ov=document.getElementById('ov');
function boom(){
  for(let w=0;w<3;w++)setTimeout(()=>{for(let i=0;i<60;i++){const e=document.createElement('span');e.className='ex';e.textContent=icons[Math.floor(Math.random()*5)];const a=Math.random()*6.283,d=120+Math.random()*Math.max(innerWidth,innerHeight)*.7;e.style.setProperty('--dx',Math.cos(a)*d+'px');e.style.setProperty('--dy',Math.sin(a)*d+'px');e.style.setProperty('--r',(Math.random()*720-360)+'deg');e.style.fontSize=(16+Math.random()*34)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),2100)}},w*350);
  setTimeout(()=>ov.classList.add('on'),500);
  setTimeout(()=>{vid.currentTime=0;vid.play().catch(()=>{})},2900);
  setTimeout(()=>rain(40),1500);
}
ov.onclick=()=>{ov.classList.remove('on');vid.pause();mus.play().catch(()=>{})};
const mus=document.getElementById('mus'),vid=document.getElementById('vid'),wel=document.getElementById('wel');
mus.volume=.7;
function start(){
  wel.classList.add('out');
  mus.play().catch(()=>{});
  setTimeout(()=>document.getElementById('e').classList.add('open'),900);
  setTimeout(()=>{document.getElementById('env').classList.add('gone');paper.classList.add('show');play()},2300);
}
wel.addEventListener('pointerdown',start,{once:true});
vid.addEventListener('error',()=>{vid.style.display='none'},true);

</script>
</body>
</html>
